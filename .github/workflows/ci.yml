name: CI

# Runs on pull requests, and is called by deploy.yml before any deployment.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Fail if lint changed files
        run: git diff --exit-code

      - name: Prettier formatting
        run: pnpm exec prettier --check .

      - name: Build Lambda bundles
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lambda bundles (CDK assets)
        run: pnpm build

      - name: Infra typecheck
        run: pnpm --filter ./infra typecheck

      - name: Infra tests (stage isolation and runtime)
        run: pnpm --filter ./infra test

      - name: Synth qa
        run: pnpm --filter ./infra exec cdk synth -c stage=qa --quiet

      - name: Synth prod
        run: pnpm --filter ./infra exec cdk synth -c stage=prod --quiet

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow files
        uses: raven-actions/actionlint@v2
