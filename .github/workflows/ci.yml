name: CI

on:
  push:
  pull_request:
  # schedule:
  #   # Nightly E2E at 02:00 UTC — re-enable when staging deploy is wired up
  #   - cron: "0 2 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        workspace:
          - apps/graphql-api
          - apps/txn-loaders
          - apps/tag-loaders
          - packages/api-client
          - packages/auth
          - packages/client
          - packages/common
          - packages/db
          - packages/logger
          - packages/parser
          - packages/nlp-tagger
          - packages/services

    defaults:
      run:
        working-directory: ${{ matrix.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run ESLint
        run: pnpm exec eslint . --ext .ts

      - name: Check Prettier formatting
        run: pnpm exec prettier --check .

      - name: Run tests
        run: pnpm run --if-present test

  fe-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @app/web typecheck

  fe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @app/web lint

  fe-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @app/web test

  fe-build:
    runs-on: ubuntu-latest
    needs: fe-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @app/web build

  fe-codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run codegen
        run: pnpm codegen
      - name: Assert no drift
        run: git diff --exit-code

  # ── Infra typecheck ──────────────────────────────────────────────────────────
  # Kept separate from the main matrix because infra uses its own CDK deps
  # and is excluded from the root ESLint config.
  infra-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Type check
        run: pnpm tsc --noEmit

  # ── E2E smoke suite ──────────────────────────────────────────────────────────
  # Runs on pushes to main and on the nightly schedule only.
  # Skipped on PRs and branch pushes to keep the feedback loop fast.
  #
  # Prerequisites in GitHub repo secrets:
  #   PLAYWRIGHT_BASE_URL  — URL of a deployed app to test against, e.g.
  #                          https://staging.full-budget.app
  #                          If unset, the job starts `pnpm dev` locally, which
  #                          requires GRAPHQL_ENDPOINT and SESSION_COOKIE_NAME
  #                          to be set as secrets too.
  fe-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: pnpm --filter @app/web exec playwright install chromium --with-deps

      - name: Run E2E smoke suite
        run: pnpm --filter @app/web e2e
        env:
          # Point to a deployed app so pnpm dev is not needed in CI.
          # Remove this env var (and add GRAPHQL_ENDPOINT) to boot a local server instead.
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          # Only needed when booting a local Next.js server (no PLAYWRIGHT_BASE_URL):
          GRAPHQL_ENDPOINT: ${{ secrets.GRAPHQL_ENDPOINT }}
          SESSION_COOKIE_NAME: ${{ secrets.SESSION_COOKIE_NAME }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
